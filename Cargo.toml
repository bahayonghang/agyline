[package]
name = "agyline"
version = "0.1.0"
edition = "2024"
description = "Fast, configurable status line for the Antigravity CLI (agy)"
license = "MIT"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
